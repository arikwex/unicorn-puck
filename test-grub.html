<!doctype html>
<html>
<head><meta charset="utf-8"><style>html,body{margin:0;background:#111}canvas{display:block}</style></head>
<body>
<canvas id="c" width="900" height="700"></canvas>
<script type="module">
import { add, tag, getObjects, remove } from './src/engine.js';
import { TAG_PLAYER } from './src/tags.js';
import Grub from './src/Grub.js';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const room = { x: 450, y: 350, w: 900, h: 700 };
const grub = Grub(450, 350, room, 42);
add(grub);

const player = { x: 450, y: 350, radius: 38, charge: 0 };
tag(player, TAG_PLAYER);

function draw(label) {
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = '#111';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  getObjects().forEach(o => o.render && o.render(ctx));
  ctx.fillStyle = '#fff';
  ctx.font = '14px sans-serif';
  ctx.fillText(label, 10, 20);
  ctx.fillText('hp=' + grub.hp + ' objects=' + getObjects().length + ' grubAlive=' + getObjects().includes(grub), 10, 40);
}

window.step = (dt) => {
  const expired = [];
  getObjects().forEach(o => {
    if (o.update && o.update(dt)) expired.push(o);
  });
  if (expired.length) remove(expired);
};
window.draw = draw;
window.grub = grub;
window.player = player;
window.getObjects = getObjects;

draw('idle');
window.__ready = true;
</script>
</body>
</html>
